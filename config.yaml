board: Bachin T-A4
name: Bachin Pen Plotter
meta: Bachin-3C-TA4, ESP32-WROOM-32D, A4988, FluidNC v4.0.3

stepping:
  engine: RMT
  idle_ms: 250
  pulse_us: 3
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  x:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 200
    soft_limits: true
    motor0:
      limit_all_pin: gpio.35:low
      hard_limits: false
      pulloff_mm: 0.5
      stepstick:
        step_pin: gpio.14
        direction_pin: gpio.12
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
    homing:
      cycle: 2
      positive_direction: false
      seek_mm_per_min: 1000
      feed_mm_per_min: 100
      settle_ms: 250

  y:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 300
    soft_limits: true
    motor0:
      limit_all_pin: gpio.34:low
      hard_limits: false
      pulloff_mm: 0.5
      stepstick:
        step_pin: gpio.26
        direction_pin: gpio.27:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
    homing:
      cycle: 1
      positive_direction: false
      seek_mm_per_min: 1000
      feed_mm_per_min: 100
      settle_ms: 250

  z:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 3500
    acceleration_mm_per_sec2: 500
    max_travel_mm: 8
    soft_limits: false
    motor0:
      limit_all_pin: NO_PIN
      hard_limits: false
      stepstick:
        step_pin: gpio.33
        direction_pin: gpio.25:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
    homing:
      cycle: -1
      mpos_mm: 0.000

Laser:
  output_pin: gpio.32
  enable_pin: NO_PIN
  pwm_hz: 5000
